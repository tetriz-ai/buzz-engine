# Slack app for buzz-engine. api.slack.com/apps > Create New App > From a manifest >
# pick your workspace > paste this. Then Install to Workspace and copy the
# "Bot User OAuth Token" (xoxb-...) into SLACK_BOT_TOKEN.
display_information:
  name: Buzz Digest
  description: Posts the daily buzz-engine digest. Read-only everywhere else.
  background_color: "#14161a"
features:
  bot_user:
    display_name: buzz-digest
    always_online: false
oauth_config:
  scopes:
    bot:
      - chat:write      # the summary message
      - files:write     # the PDF briefing
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
